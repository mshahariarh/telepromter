plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gdstudio.teleprompter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gdstudio.teleprompter'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '5.0'
    }

    signingConfigs {
        gd {
            storeFile file('gd-debug.keystore')
            storePassword 'android'
            keyAlias 'gddebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gd
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.zxing:core:3.5.3'
}
