plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gdstudio.teleprompter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gdstudio.teleprompter'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        gd {
            storeFile file('gd-debug.keystore')
            storePassword 'android'
            keyAlias 'gddebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gd
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
