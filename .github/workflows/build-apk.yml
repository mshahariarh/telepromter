name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Bangla fonts (Google Fonts, OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          base=https://github.com/google/fonts/raw/main/ofl
          get() { curl -fsSL -o "$1" "$base/$2" || rm -f "$1"; }
          get Hind_Siliguri.ttf hindsiliguri/HindSiliguri-Regular.ttf
          get Noto_Sans_Bengali.ttf "notosansbengali/NotoSansBengali%5Bwdth,wght%5D.ttf"
          get Noto_Serif_Bengali.ttf "notoserifbengali/NotoSerifBengali%5Bwdth,wght%5D.ttf"
          get Anek_Bangla.ttf "anekbangla/AnekBangla%5Bwdth,wght%5D.ttf"
          get Baloo_Da_2.ttf "balooda2/BalooDa2%5Bwght%5D.ttf"
          get Tiro_Bangla.ttf tirobangla/TiroBangla-Regular.ttf
          get Galada.ttf galada/Galada-Regular.ttf
          get Mina.ttf mina/Mina-Regular.ttf
          ls -la

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GD-Teleprompter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GD-Teleprompter-APK
          path: GD-Teleprompter.apk

      - name: Publish to Releases (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GD Teleprompter (latest)
          files: GD-Teleprompter.apk
          make_latest: true
